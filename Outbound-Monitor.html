<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Monitor Outbound GTW BDO</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', 'Segoe UI', sans-serif; background: #F8FAFC; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 3px; }
  select, input, button { font-family: 'DM Sans', 'Segoe UI', sans-serif; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

const GAS_URL = "https://script.google.com/macros/s/AKfycbzdurVlRVkqQ6l39DNKYV4gJUj2RM7tv5gX1E984uTdQukJWjw87Elbsx7YiocByLjsGQ/exec";

const COLORS = {
  blue:    "#1565C0",
  blue2:   "#1976D2",
  blueL:   "#E3F2FD",
  green:   "#2E7D32",
  greenL:  "#E8F5E9",
  orange:  "#E65100",
  orangeL: "#FFF3E0",
  red:     "#B71C1C",
  redL:    "#FFEBEE",
  gray1:   "#F8FAFC",
  gray2:   "#F1F5F9",
  gray3:   "#E2E8F0",
  gray5:   "#94A3B8",
  gray7:   "#334155",
  gray8:   "#1E293B",
  white:   "#FFFFFF",
};

async function gasGet(action, params = {}) {
  const url = new URL(GAS_URL);
  url.searchParams.set("action", action);
  Object.keys(params).forEach(k => url.searchParams.set(k, params[k]));
  try {
    const r = await fetch(url.toString(), { redirect: "follow", mode: "cors" });
    return await r.json();
  } catch {
    return { error: "Network error" };
  }
}

function fmtDate(s) {
  if (!s) return "—";
  const d = new Date(s.replace(" ", "T"));
  if (isNaN(d)) return s;
  return d.toLocaleDateString("id-ID", { day: "2-digit", month: "short", year: "2-digit" }) +
    " " + d.toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit" });
}

function StatusBadge({ status }) {
  const ok = status === "SELESAI";
  return (
    <span style={{
      display: "inline-flex", alignItems: "center", gap: 4,
      padding: "2px 10px", borderRadius: 20, fontSize: 11, fontWeight: 700,
      background: ok ? COLORS.greenL : COLORS.orangeL,
      color: ok ? COLORS.green : COLORS.orange,
      letterSpacing: .4,
    }}>
      <span style={{ width: 6, height: 6, borderRadius: "50%", background: ok ? COLORS.green : COLORS.orange, display: "inline-block" }} />
      {status || "—"}
    </span>
  );
}

function StatCard({ label, value, color, icon, sub }) {
  const fg = color === "blue" ? COLORS.blue : color === "green" ? COLORS.green : COLORS.orange;
  return (
    <div style={{
      background: COLORS.white, borderRadius: 14, padding: "18px 20px",
      boxShadow: "0 2px 12px rgba(0,0,0,.06)", flex: 1, minWidth: 120,
      borderLeft: `4px solid ${fg}`, display: "flex", flexDirection: "column", gap: 4,
    }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
        <span style={{ fontSize: 20 }}>{icon}</span>
        <span style={{ fontSize: 12, color: COLORS.gray5, fontWeight: 600, textTransform: "uppercase", letterSpacing: .6 }}>{label}</span>
      </div>
      <div style={{ fontSize: 32, fontWeight: 800, color: fg, lineHeight: 1.1 }}>{value}</div>
      {sub && <div style={{ fontSize: 11, color: COLORS.gray5 }}>{sub}</div>}
    </div>
  );
}

function Spinner({ size = 28 }) {
  return (
    <div style={{
      width: size, height: size,
      border: `3px solid ${COLORS.gray3}`,
      borderTop: `3px solid ${COLORS.blue2}`,
      borderRadius: "50%",
      animation: "spin .65s linear infinite",
      display: "inline-block",
    }} />
  );
}

function Tag({ label, color = COLORS.blueL, textColor = COLORS.blue }) {
  return (
    <span style={{
      background: color, color: textColor,
      padding: "2px 8px", borderRadius: 6,
      fontSize: 11, fontWeight: 700, letterSpacing: .3,
    }}>{label}</span>
  );
}

function DataTable({ cols, rows, emptyText = "Tidak ada data", loading }) {
  if (loading) return (
    <div style={{ display: "flex", justifyContent: "center", padding: 48 }}>
      <Spinner size={36} />
    </div>
  );
  if (!rows.length) return (
    <div style={{ textAlign: "center", padding: 48, color: COLORS.gray5, fontSize: 14 }}>{emptyText}</div>
  );
  return (
    <div style={{ overflowX: "auto" }}>
      <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
        <thead>
          <tr style={{ background: COLORS.gray1 }}>
            {cols.map((c, i) => (
              <th key={i} style={{
                padding: "9px 12px", textAlign: "left", fontSize: 11, fontWeight: 700,
                color: COLORS.gray5, letterSpacing: .6, textTransform: "uppercase",
                borderBottom: `2px solid ${COLORS.gray3}`, whiteSpace: "nowrap",
              }}>{c.label}</th>
            ))}
          </tr>
        </thead>
        <tbody>
          {rows.map((row, ri) => (
            <tr key={ri} style={{ borderBottom: `1px solid ${COLORS.gray2}` }}
              onMouseEnter={e => e.currentTarget.style.background = COLORS.gray1}
              onMouseLeave={e => e.currentTarget.style.background = "transparent"}>
              {cols.map((c, ci) => (
                <td key={ci} style={{ padding: "9px 12px", color: COLORS.gray7, verticalAlign: "middle" }}>
                  {c.render ? c.render(row[c.key], row) : (row[c.key] || "—")}
                </td>
              ))}
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

function PageRingkasan({ obData, hvsData, ibData, loadingOb, loadingHvs, loadingIb }) {
  const obTotal = obData.reduce((s, x) => s + (+x.total_awb || 0), 0);
  const hvsTotal = hvsData.reduce((s, x) => s + (+x.total_awb || 0), 0);
  const ibTotal = ibData.reduce((s, x) => s + (+x.total_awb || 0), 0);
  const obSelesai = obData.filter(x => x.status === "SELESAI").length;
  const hvsSelesai = hvsData.filter(x => x.status === "SELESAI").length;
  const ibSelesai = ibData.filter(x => x.status === "SELESAI").length;

  const allRecent = [
    ...obData.map(x => ({ ...x, _type: "OB" })),
    ...hvsData.map(x => ({ ...x, _type: "HVS" })),
    ...ibData.map(x => ({ ...x, _type: "IB" })),
  ].sort((a, b) => (b.created_date || "").localeCompare(a.created_date || "")).slice(0, 12);

  const typeColor = { OB: COLORS.blue, HVS: "#6A1B9A", IB: "#00695C" };
  const typeBg   = { OB: COLORS.blueL, HVS: "#F3E5F5", IB: "#E0F2F1" };
  const isLoading = loadingOb || loadingHvs || loadingIb;

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(160px, 1fr))", gap: 14 }}>
        <StatCard label="OB Total AWB" value={obTotal} color="blue" icon="🚚" sub={`${obSelesai} selesai / ${obData.length - obSelesai} proses`} />
        <StatCard label="HVS Total AWB" value={hvsTotal} color="blue" icon="📦" sub={`${hvsSelesai} selesai / ${hvsData.length - hvsSelesai} proses`} />
        <StatCard label="IB Total AWB" value={ibTotal} color="green" icon="📥" sub={`${ibSelesai} selesai / ${ibData.length - ibSelesai} proses`} />
        <StatCard label="Total Track" value={obData.length + hvsData.length + ibData.length} color="orange" icon="📋" sub={`OB: ${obData.length} | HVS: ${hvsData.length} | IB: ${ibData.length}`} />
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(200px, 1fr))", gap: 14 }}>
        {[
          { label: "OB Selesai", done: obSelesai, total: obData.length, color: COLORS.blue },
          { label: "HVS Selesai", done: hvsSelesai, total: hvsData.length, color: "#6A1B9A" },
          { label: "IB Selesai", done: ibSelesai, total: ibData.length, color: "#00695C" },
        ].map((p, i) => {
          const pct = p.total ? Math.round((p.done / p.total) * 100) : 0;
          return (
            <div key={i} style={{ background: COLORS.white, borderRadius: 12, padding: "16px 18px", boxShadow: "0 2px 8px rgba(0,0,0,.05)" }}>
              <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 8 }}>
                <span style={{ fontSize: 13, fontWeight: 600, color: COLORS.gray7 }}>{p.label}</span>
                <span style={{ fontSize: 13, fontWeight: 700, color: p.color }}>{pct}%</span>
              </div>
              <div style={{ height: 8, background: COLORS.gray2, borderRadius: 4, overflow: "hidden" }}>
                <div style={{ height: "100%", width: `${pct}%`, background: p.color, borderRadius: 4, transition: "width .5s ease" }} />
              </div>
              <div style={{ fontSize: 11, color: COLORS.gray5, marginTop: 6 }}>{p.done} / {p.total} track selesai</div>
            </div>
          );
        })}
      </div>

      <div style={{ background: COLORS.white, borderRadius: 14, boxShadow: "0 2px 12px rgba(0,0,0,.06)", overflow: "hidden" }}>
        <div style={{ padding: "14px 18px", borderBottom: `1px solid ${COLORS.gray3}`, display: "flex", alignItems: "center", gap: 10 }}>
          <span style={{ fontSize: 18 }}>🕒</span>
          <span style={{ fontWeight: 700, fontSize: 15, color: COLORS.gray8 }}>Aktivitas Terbaru</span>
          {isLoading && <Spinner size={16} />}
        </div>
        {isLoading ? (
          <div style={{ display: "flex", justifyContent: "center", padding: 36 }}><Spinner /></div>
        ) : allRecent.length === 0 ? (
          <div style={{ textAlign: "center", padding: 36, color: COLORS.gray5 }}>Belum ada data</div>
        ) : (
          <div style={{ overflowX: "auto" }}>
            <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
              <thead>
                <tr style={{ background: COLORS.gray1 }}>
                  {["Tipe","No Track","Incharge","Service","Tujuan","AWB","Waktu","Status"].map((h,i) => (
                    <th key={i} style={{ padding: "9px 12px", textAlign: "left", fontSize: 11, fontWeight: 700, color: COLORS.gray5, letterSpacing: .6, textTransform: "uppercase", borderBottom: `2px solid ${COLORS.gray3}`, whiteSpace: "nowrap" }}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {allRecent.map((row, ri) => (
                  <tr key={ri} style={{ borderBottom: `1px solid ${COLORS.gray2}` }}
                    onMouseEnter={e => e.currentTarget.style.background = COLORS.gray1}
                    onMouseLeave={e => e.currentTarget.style.background = "transparent"}>
                    <td style={{ padding: "9px 12px" }}><Tag label={row._type} color={typeBg[row._type]} textColor={typeColor[row._type]} /></td>
                    <td style={{ padding: "9px 12px", fontFamily: "monospace", fontSize: 12, color: COLORS.gray7, maxWidth: 160, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{row.no_track || "—"}</td>
                    <td style={{ padding: "9px 12px", color: COLORS.gray7 }}>{row.incharge || "—"}</td>
                    <td style={{ padding: "9px 12px", color: COLORS.gray7 }}>{row.service || "—"}</td>
                    <td style={{ padding: "9px 12px", color: COLORS.gray7 }}>{row.tujuan || row.from || "—"}</td>
                    <td style={{ padding: "9px 12px", fontWeight: 700, color: COLORS.blue }}>{row.total_awb || 0}</td>
                    <td style={{ padding: "9px 12px", color: COLORS.gray5, whiteSpace: "nowrap", fontSize: 12 }}>{fmtDate(row.created_date)}</td>
                    <td style={{ padding: "9px 12px" }}><StatusBadge status={row.status} /></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>
    </div>
  );
}

function PageTable({ data, loading, type, inchargeFilter }) {
  const [search, setSearch] = React.useState("");
  const [statusFilter, setStatusFilter] = React.useState("");
  const [serviceFilter, setServiceFilter] = React.useState("");

  const typeColor = { ob: COLORS.blue, hvs: "#6A1B9A", ib: "#00695C" };
  const typeBg   = { ob: COLORS.blueL, hvs: "#F3E5F5", ib: "#E0F2F1" };
  const fg = typeColor[type];

  const filtered = data.filter(row => {
    const q = search.toLowerCase();
    const matchSearch = !q || [row.no_track, row.incharge, row.service, row.tujuan, row.from].some(v => (v || "").toLowerCase().includes(q));
    const matchIncharge = !inchargeFilter || row.incharge === inchargeFilter;
    const matchStatus = !statusFilter || row.status === statusFilter;
    const matchService = !serviceFilter || row.service === serviceFilter;
    return matchSearch && matchIncharge && matchStatus && matchService;
  });

  const services = [...new Set(data.map(r => r.service).filter(Boolean))].sort();
  const totalAwb = filtered.reduce((s, x) => s + (+x.total_awb || 0), 0);
  const selesai = filtered.filter(x => x.status === "SELESAI").length;

  const cols = type === "ib" ? [
    { key: "no_track", label: "No Track", render: v => <span style={{ fontFamily: "monospace", fontSize: 11, color: COLORS.gray7 }}>{v || "—"}</span> },
    { key: "incharge", label: "Incharge" },
    { key: "service", label: "Service", render: v => v ? <Tag label={v} color={typeBg[type]} textColor={fg} /> : "—" },
    { key: "from", label: "From (Kota)" },
    { key: "tujuan", label: "Tujuan" },
    { key: "total_awb", label: "AWB", render: v => <span style={{ fontWeight: 700, color: fg }}>{v || 0}</span> },
    { key: "created_date", label: "Waktu", render: v => <span style={{ fontSize: 12, color: COLORS.gray5 }}>{fmtDate(v)}</span> },
    { key: "status", label: "Status", render: v => <StatusBadge status={v} /> },
  ] : [
    { key: "no_track", label: "No Track", render: v => <span style={{ fontFamily: "monospace", fontSize: 11, color: COLORS.gray7 }}>{v || "—"}</span> },
    { key: "incharge", label: "Incharge" },
    { key: "service", label: "Service", render: v => v ? <Tag label={v} color={typeBg[type]} textColor={fg} /> : "—" },
    { key: "tujuan", label: "Tujuan" },
    { key: "total_awb", label: "AWB", render: v => <span style={{ fontWeight: 700, color: fg }}>{v || 0}</span> },
    { key: "created_date", label: "Waktu", render: v => <span style={{ fontSize: 12, color: COLORS.gray5 }}>{fmtDate(v)}</span> },
    { key: "status", label: "Status", render: v => <StatusBadge status={v} /> },
  ];

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
        <StatCard label="Total AWB" value={totalAwb} color="blue" icon="📦" />
        <StatCard label="Selesai" value={selesai} color="green" icon="✅" />
        <StatCard label="On Proses" value={filtered.length - selesai} color="orange" icon="⏳" />
      </div>
      <div style={{ background: COLORS.white, borderRadius: 12, padding: "12px 16px", boxShadow: "0 2px 8px rgba(0,0,0,.05)", display: "flex", flexWrap: "wrap", gap: 10, alignItems: "center" }}>
        <input value={search} onChange={e => setSearch(e.target.value)}
          placeholder="🔍 Cari no track, incharge, tujuan..."
          style={{ flex: 1, minWidth: 200, padding: "8px 12px", border: `1.5px solid ${COLORS.gray3}`, borderRadius: 8, fontSize: 13, outline: "none" }} />
        <select value={statusFilter} onChange={e => setStatusFilter(e.target.value)}
          style={{ padding: "8px 12px", border: `1.5px solid ${COLORS.gray3}`, borderRadius: 8, fontSize: 13, background: COLORS.white, outline: "none" }}>
          <option value="">Semua Status</option>
          <option value="ON PROSES">ON PROSES</option>
          <option value="SELESAI">SELESAI</option>
        </select>
        {services.length > 0 && (
          <select value={serviceFilter} onChange={e => setServiceFilter(e.target.value)}
            style={{ padding: "8px 12px", border: `1.5px solid ${COLORS.gray3}`, borderRadius: 8, fontSize: 13, background: COLORS.white, outline: "none" }}>
            <option value="">Semua Service</option>
            {services.map(s => <option key={s} value={s}>{s}</option>)}
          </select>
        )}
        <span style={{ fontSize: 12, color: COLORS.gray5, marginLeft: "auto" }}>{filtered.length} data</span>
      </div>
      <div style={{ background: COLORS.white, borderRadius: 14, boxShadow: "0 2px 12px rgba(0,0,0,.06)", overflow: "hidden" }}>
        <DataTable cols={cols} rows={filtered} loading={loading} emptyText="Tidak ada data yang cocok" />
      </div>
    </div>
  );
}

function PageSearch() {
  const [q, setQ] = React.useState("");
  const [results, setResults] = React.useState([]);
  const [loading, setLoading] = React.useState(false);
  const [searched, setSearched] = React.useState(false);

  async function doSearch() {
    if (!q.trim()) return;
    setLoading(true); setSearched(true);
    const r = await gasGet("searchAwb", { q: q.trim() });
    setResults(r.list || []);
    setLoading(false);
  }

  const typeColor = { ob: COLORS.blue, hvs: "#6A1B9A", ib: "#00695C" };
  const typeBg   = { ob: COLORS.blueL, hvs: "#F3E5F5", ib: "#E0F2F1" };

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 18 }}>
      <div style={{ background: COLORS.white, borderRadius: 14, padding: "24px", boxShadow: "0 2px 12px rgba(0,0,0,.06)" }}>
        <div style={{ fontSize: 15, fontWeight: 700, color: COLORS.gray8, marginBottom: 14 }}>🔍 Cari Nomor AWB</div>
        <div style={{ display: "flex", gap: 10 }}>
          <input value={q} onChange={e => setQ(e.target.value)}
            onKeyDown={e => e.key === "Enter" && doSearch()}
            placeholder="Masukkan nomor AWB atau sebagian nomor..."
            style={{ flex: 1, padding: "11px 16px", border: `2px solid ${COLORS.gray3}`, borderRadius: 10, fontSize: 14, outline: "none", fontFamily: "monospace" }}
            autoFocus />
          <button onClick={doSearch} disabled={loading}
            style={{ padding: "0 22px", background: COLORS.blue, color: "#fff", border: "none", borderRadius: 10, fontSize: 14, fontWeight: 700, cursor: "pointer", display: "flex", alignItems: "center", gap: 8 }}>
            {loading ? <Spinner size={18} /> : "Cari"}
          </button>
        </div>
      </div>
      {searched && !loading && (
        <div style={{ background: COLORS.white, borderRadius: 14, boxShadow: "0 2px 12px rgba(0,0,0,.06)", overflow: "hidden" }}>
          <div style={{ padding: "12px 18px", borderBottom: `1px solid ${COLORS.gray3}`, fontSize: 13, color: COLORS.gray5 }}>
            {results.length} hasil ditemukan untuk <strong style={{ color: COLORS.gray8 }}>"{q}"</strong>
          </div>
          {results.length === 0 ? (
            <div style={{ textAlign: "center", padding: 48, color: COLORS.gray5 }}>AWB tidak ditemukan</div>
          ) : (
            <div style={{ overflowX: "auto" }}>
              <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
                <thead>
                  <tr style={{ background: COLORS.gray1 }}>
                    {["Tipe","AWB","No Track","Incharge","Service","Tujuan","Tanggal","Status"].map((h,i) => (
                      <th key={i} style={{ padding: "9px 12px", textAlign: "left", fontSize: 11, fontWeight: 700, color: COLORS.gray5, letterSpacing: .6, textTransform: "uppercase", borderBottom: `2px solid ${COLORS.gray3}` }}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {results.map((row, ri) => (
                    <tr key={ri} style={{ borderBottom: `1px solid ${COLORS.gray2}` }}
                      onMouseEnter={e => e.currentTarget.style.background = COLORS.gray1}
                      onMouseLeave={e => e.currentTarget.style.background = "transparent"}>
                      <td style={{ padding: "9px 12px" }}><Tag label={(row.type||"").toUpperCase()} color={typeBg[row.type]} textColor={typeColor[row.type]} /></td>
                      <td style={{ padding: "9px 12px", fontFamily: "monospace", fontWeight: 700, color: COLORS.gray8 }}>{row.awb}</td>
                      <td style={{ padding: "9px 12px", fontFamily: "monospace", fontSize: 11, color: COLORS.gray5 }}>{row.noTrack || "—"}</td>
                      <td style={{ padding: "9px 12px" }}>{row.incharge || "—"}</td>
                      <td style={{ padding: "9px 12px" }}>{row.service || "—"}</td>
                      <td style={{ padding: "9px 12px" }}>{row.tujuan || "—"}</td>
                      <td style={{ padding: "9px 12px", fontSize: 12, color: COLORS.gray5 }}>{fmtDate(row.date)}</td>
                      <td style={{ padding: "9px 12px" }}><StatusBadge status={row.status} /></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function App() {
  const [page, setPage] = React.useState("ringkasan");
  const [obData, setObData] = React.useState([]);
  const [hvsData, setHvsData] = React.useState([]);
  const [ibData, setIbData] = React.useState([]);
  const [globalIncharge, setGlobalIncharge] = React.useState("");
  const [allIncharges, setAllIncharges] = React.useState([]);
  const [loadingOb, setLoadingOb] = React.useState(true);
  const [loadingHvs, setLoadingHvs] = React.useState(true);
  const [loadingIb, setLoadingIb] = React.useState(true);
  const [sidebarOpen, setSidebarOpen] = React.useState(true);
  const [showInchargeDrop, setShowInchargeDrop] = React.useState(false);
  const [refreshing, setRefreshing] = React.useState(false);
  const [toast, setToast] = React.useState(null);

  function showToast(msg, type = "success") {
    setToast({ msg, type });
    setTimeout(() => setToast(null), 3000);
  }

  async function loadAll() {
    setLoadingOb(true); setLoadingHvs(true); setLoadingIb(true);
    const [md, ob] = await Promise.all([gasGet("getMasterData"), gasGet("getObList")]);
    const combined = [...(md.obIncharges || []), ...(md.ibIncharges || [])].filter((v, i, a) => a.indexOf(v) === i).sort();
    setAllIncharges(combined);
    setObData(ob.list || []);
    setLoadingOb(false);
    gasGet("getHvsList").then(r => { setHvsData(r.list || []); setLoadingHvs(false); });
    gasGet("getIbList").then(r => { setIbData(r.list || []); setLoadingIb(false); });
  }

  async function handleRefresh() {
    setRefreshing(true);
    await loadAll();
    setRefreshing(false);
    showToast("Data diperbarui ✓");
  }

  React.useEffect(() => { loadAll(); }, []);

  const navItems = [
    { id: "ringkasan", label: "Ringkasan", icon: "📊" },
    { id: "ob",        label: "Outbound BDO", icon: "🚚" },
    { id: "hvs",       label: "Outbound HVS", icon: "📦" },
    { id: "ib",        label: "Inbound HVS",  icon: "📥" },
    { id: "search",    label: "Cari AWB",      icon: "🔍" },
  ];

  const pageTitles = { ringkasan: "Dashboard Ringkasan", ob: "Outbound BDO", hvs: "Outbound HVS", ib: "Inbound HVS", search: "Cari AWB" };
  const pageSubs   = { ringkasan: "Overview semua aktivitas pengiriman", ob: "Log pengiriman keluar dari hub", hvs: "High Value Shipment keluar", ib: "High Value Shipment masuk", search: "Pencarian AWB di semua data" };

  const sideW = sidebarOpen ? 220 : 64;

  return (
    <div style={{ fontFamily: "'DM Sans','Segoe UI',sans-serif", background: COLORS.gray1, minHeight: "100vh", display: "flex" }}>

      {/* SIDEBAR */}
      <div style={{
        width: sideW, minHeight: "100vh", background: "#0F172A",
        display: "flex", flexDirection: "column",
        transition: "width .25s ease", overflow: "hidden",
        position: "fixed", top: 0, left: 0, bottom: 0, zIndex: 100,
        boxShadow: "2px 0 16px rgba(0,0,0,.15)",
      }}>
        {/* Brand */}
        <div style={{ padding: "20px 16px 16px", display: "flex", alignItems: "center", gap: 12, borderBottom: "1px solid rgba(255,255,255,.08)" }}>
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.85)" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" style={{ flexShrink: 0 }}>
            <rect x="2" y="3" width="20" height="14" rx="2" />
            <line x1="8" y1="21" x2="16" y2="21" />
            <line x1="12" y1="17" x2="12" y2="21" />
          </svg>
          {sidebarOpen && (
            <div>
              <div style={{ fontSize: 10, color: "rgba(255,255,255,.5)", fontWeight: 600, letterSpacing: .8, textTransform: "uppercase" }}>GTW BDO</div>
              <div style={{ fontSize: 13, color: "#fff", fontWeight: 700, lineHeight: 1.3, whiteSpace: "nowrap" }}>Monitor Outbound</div>
            </div>
          )}
        </div>

        {/* Toggle */}
        <button onClick={() => setSidebarOpen(!sidebarOpen)} style={{
          background: "none", border: "none", color: "rgba(255,255,255,.4)",
          cursor: "pointer", padding: "8px 16px", textAlign: sidebarOpen ? "right" : "center",
          fontSize: 18, transition: "color .15s",
        }}>
          {sidebarOpen ? "◀" : "▶"}
        </button>

        {/* Nav */}
        <nav style={{ flex: 1, padding: "8px 8px" }}>
          {navItems.map(item => {
            const active = page === item.id;
            return (
              <button key={item.id} onClick={() => setPage(item.id)}
                style={{
                  width: "100%", display: "flex", alignItems: "center", gap: 12,
                  padding: sidebarOpen ? "11px 12px" : "11px 0", justifyContent: sidebarOpen ? "flex-start" : "center",
                  background: active ? "rgba(59,130,246,.18)" : "none",
                  border: active ? "1px solid rgba(59,130,246,.3)" : "1px solid transparent",
                  borderRadius: 10, cursor: "pointer", marginBottom: 4,
                  color: active ? "#93C5FD" : "rgba(255,255,255,.5)",
                  fontSize: 13, fontWeight: active ? 700 : 500,
                  transition: "all .15s",
                }}
                onMouseEnter={e => { if (!active) e.currentTarget.style.background = "rgba(255,255,255,.06)"; }}
                onMouseLeave={e => { if (!active) e.currentTarget.style.background = "none"; }}>
                <span style={{ fontSize: 18, flexShrink: 0 }}>{item.icon}</span>
                {sidebarOpen && <span style={{ whiteSpace: "nowrap" }}>{item.label}</span>}
              </button>
            );
          })}
        </nav>

        {sidebarOpen && (
          <div style={{ padding: "12px 16px", borderTop: "1px solid rgba(255,255,255,.08)", fontSize: 11, color: "rgba(255,255,255,.25)" }}>
            v4.2 — GTW BDO Dashboard
          </div>
        )}
      </div>

      {/* MAIN */}
      <div style={{ marginLeft: sideW, flex: 1, display: "flex", flexDirection: "column", transition: "margin-left .25s ease", minWidth: 0 }}>
        {/* Topbar */}
        <div style={{
          background: COLORS.white, padding: "0 24px", height: 60,
          display: "flex", alignItems: "center", gap: 16,
          boxShadow: "0 1px 8px rgba(0,0,0,.06)", position: "sticky", top: 0, zIndex: 50,
        }}>
          <div style={{ flex: 1 }}>
            <div style={{ fontSize: 16, fontWeight: 800, color: COLORS.gray8 }}>{pageTitles[page]}</div>
            <div style={{ fontSize: 11, color: COLORS.gray5 }}>{pageSubs[page]}</div>
          </div>

          {/* Incharge selector */}
          <div style={{ position: "relative" }}>
            <button onClick={() => setShowInchargeDrop(!showInchargeDrop)}
              style={{
                display: "flex", alignItems: "center", gap: 8, padding: "8px 14px", borderRadius: 10,
                background: globalIncharge ? COLORS.blueL : COLORS.gray2,
                border: `1.5px solid ${globalIncharge ? COLORS.blue2 : COLORS.gray3}`,
                cursor: "pointer", fontSize: 13, fontWeight: 600,
                color: globalIncharge ? COLORS.blue : COLORS.gray5,
              }}>
              👤 {globalIncharge || "— Pilih Incharge —"}
              <span style={{ fontSize: 12 }}>▾</span>
            </button>
            {showInchargeDrop && (
              <div style={{
                position: "absolute", top: "calc(100% + 8px)", right: 0,
                background: COLORS.white, borderRadius: 12, boxShadow: "0 8px 32px rgba(0,0,0,.15)",
                border: `1px solid ${COLORS.gray3}`, minWidth: 200, zIndex: 200, maxHeight: 280, overflowY: "auto",
              }}>
                <div onClick={() => { setGlobalIncharge(""); setShowInchargeDrop(false); }}
                  style={{ padding: "10px 14px", cursor: "pointer", fontSize: 13, color: COLORS.gray5, borderBottom: `1px solid ${COLORS.gray2}` }}
                  onMouseEnter={e => e.currentTarget.style.background = COLORS.gray1}
                  onMouseLeave={e => e.currentTarget.style.background = "transparent"}>
                  — Semua Incharge —
                </div>
                {allIncharges.map(v => (
                  <div key={v} onClick={() => { setGlobalIncharge(v); setShowInchargeDrop(false); }}
                    style={{ padding: "10px 14px", cursor: "pointer", fontSize: 13, color: COLORS.gray7, background: globalIncharge === v ? COLORS.blueL : "transparent", fontWeight: globalIncharge === v ? 700 : 400 }}
                    onMouseEnter={e => { if (globalIncharge !== v) e.currentTarget.style.background = COLORS.gray1; }}
                    onMouseLeave={e => { if (globalIncharge !== v) e.currentTarget.style.background = "transparent"; }}>
                    {v}
                  </div>
                ))}
              </div>
            )}
          </div>

          {/* Refresh */}
          <button onClick={handleRefresh} disabled={refreshing}
            style={{
              display: "flex", alignItems: "center", gap: 6, padding: "8px 14px", borderRadius: 10,
              background: COLORS.blue, color: "#fff", border: "none", cursor: "pointer", fontSize: 13, fontWeight: 700,
              opacity: refreshing ? .7 : 1,
            }}>
            {refreshing ? <><Spinner size={14} /> Memuat...</> : <>🔄 Refresh</>}
          </button>
        </div>

        {/* Content */}
        <div style={{ flex: 1, padding: "24px", animation: "fadeIn .3s ease" }} key={page}>
          {page === "ringkasan" && <PageRingkasan obData={obData} hvsData={hvsData} ibData={ibData} loadingOb={loadingOb} loadingHvs={loadingHvs} loadingIb={loadingIb} />}
          {page === "ob"        && <PageTable data={obData}  loading={loadingOb}  type="ob"  inchargeFilter={globalIncharge} />}
          {page === "hvs"       && <PageTable data={hvsData} loading={loadingHvs} type="hvs" inchargeFilter={globalIncharge} />}
          {page === "ib"        && <PageTable data={ibData}  loading={loadingIb}  type="ib"  inchargeFilter={globalIncharge} />}
          {page === "search"    && <PageSearch />}
        </div>
      </div>

      {/* Click-away dropdown */}
      {showInchargeDrop && <div style={{ position: "fixed", inset: 0, zIndex: 49 }} onClick={() => setShowInchargeDrop(false)} />}

      {/* Toast */}
      {toast && (
        <div style={{
          position: "fixed", bottom: 24, right: 24, zIndex: 999,
          background: toast.type === "error" ? COLORS.red : "#1B5E20",
          color: "#fff", padding: "12px 20px", borderRadius: 10,
          fontSize: 14, fontWeight: 600, boxShadow: "0 4px 16px rgba(0,0,0,.2)",
          animation: "fadeIn .2s ease",
        }}>
          {toast.msg}
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
